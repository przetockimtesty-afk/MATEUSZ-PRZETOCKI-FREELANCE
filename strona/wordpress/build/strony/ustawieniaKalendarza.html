<!-- /wp:heading -->

<!-- wp:paragraph {"className":"is-style-wstep"} -->
<p class="is-style-wstep">Jak długo trwa spotkanie, w jakich godzinach przyjmujesz i o co pytać klienta przy rezerwacji.</p>
<!-- /wp:paragraph -->

<!-- wp:list {"className":"is-style-lista-znaczniki"} -->

<!-- /wp:list-item -->

<!-- wp:list-item -->
<li>Przy odbiorze strony zrobimy razem próbną rezerwację.</li>
